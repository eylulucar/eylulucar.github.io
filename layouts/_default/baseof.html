<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f4">
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <title>{{ .Title }}{{ if not .IsHome }} · {{ site.Title }}{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="{{ "favicon.png" | relURL }}">
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
</head>
<body id="haut">
  <a class="skip" href="#contenu">Aller au contenu</a>
  <header class="masthead">
    <div class="wrap nav">
      <a class="signature" href="{{ site.Home.RelPermalink }}" aria-label="Eylül Uçar, accueil">
        <span class="monogram" aria-hidden="true">e.</span>Eylül Uçar
      </a>
      <nav aria-label="Navigation principale">
        <a href="{{ site.Home.RelPermalink }}#projets">Projets</a>
        <a href="{{ site.Home.RelPermalink }}#a-propos">À propos</a>
        <a class="profile" href="{{ site.Params.github }}">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="contenu">{{ block "main" . }}{{ end }}</main>
  <footer><div class="wrap foot"><span>Eylül Uçar</span><a href="#haut">Haut de page ↑</a></div></footer>
</body>
</html>
