{{ define "main" }}
<article class="wrap story">
  <a class="back" href="{{ site.Home.RelPermalink }}#projets">← {{ T "allProjects" }}</a>
  <div class="story-head"><p class="eyebrow"><i></i>{{ .Params.category }}</p>
    <h1>{{ .Title }}</h1><p class="intro">{{ .Description }}</p>
  </div>
  <img class="story-photo" src="{{ .Params.image | relURL }}" alt="{{ .Params.imageAlt }}" width="960" height="500">
  <div class="prose">{{ .Content }}{{ if .Params.academyMedia }}{{ partial "academy-media.html" . }}{{ end }}<a class="button" href="{{ .Params.sourceURL }}">{{ .Params.sourceLabel }} <span aria-hidden="true">↗</span></a></div>
</article>
{{ end }}
