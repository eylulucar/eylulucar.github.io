name: Publier le carnet sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Installer Hugo et vérifier l’archive
        env:
          HUGO_VERSION: 0.147.9
          HUGO_SHA256: 96d367bc839b170cfc34470e41844594f4b7846a39e87850b2cb1f8c81b0d11b
        run: |
          cd "$RUNNER_TEMP"
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$archive"
          echo "$HUGO_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" hugo
      - name: Générer le site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: '"$RUNNER_TEMP/hugo" --minify --baseURL "${PAGES_URL%/}/"'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
